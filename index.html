<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e1e2a">
    <link rel="manifest" href="manifest.json">
    <title>Chrono-Vision | VIGIA</title>
    <style>
        body { background-color: #1e1e2a; color: #fff; font-family: Arial, sans-serif; padding: 20px; margin: 0; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        h1 { color: #8f8; text-align: center; margin-top: 0; }
        .container { display: flex; gap: 20px; justify-content: center; margin-bottom: 20px; }
        .card { background: #2b2b3a; border-left: 4px solid #7fd7ff; padding: 20px; border-radius: 8px; width: 200px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); text-align: center; }
        .card h3 { margin-top: 0; color: #ffd26e; font-size: 14px; }
        .card p { font-size: 20px; font-weight: bold; margin: 10px 0 0 0; }
        .card small { color: #888; font-size: 10px; display: block; margin-top: 5px; }
        #status { text-align: center; color: #8f8; margin-bottom: 10px; font-weight: bold; }
        .main-area { display: flex; gap: 20px; flex-grow: 1; max-width: 1000px; margin: 0 auto; width: 100%; }
        #chat-container { flex: 1; display: flex; flex-direction: column; background: #2b2b3a; border-radius: 8px; overflow: hidden; border: 1px solid #444; }
        #chat-box { flex-grow: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px; border-radius: 5px; max-width: 80%; font-size: 14px; }
        .msg-user { background: #4a4a6a; align-self: flex-end; }
        .msg-luma { background: #1e1e2a; border-left: 3px solid #8f8; align-self: flex-start; white-space: pre-wrap; }
        #chat-input-area { display: flex; padding: 10px; background: #1a1a24; }
        #chat-input { flex-grow: 1; padding: 10px; border: none; border-radius: 4px; background: #3a3a52; color: #fff; }
        #send-btn { padding: 10px 20px; margin-left: 10px; background: #8f8; color: #000; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        #preview-container { flex: 1; background: #000; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 2px dashed #444; padding: 20px; }
        #preview-text { color: #555; margin-top: 0; }
    </style>
</head>
<body>
    <h1>Chrono-Vision Dashboard</h1>
    <div id="status">A ligar ao VIGIA...</div>
    <div class="container" id="metrics"></div>
    <div class="main-area">
        <div id="chat-container">
            <div id="chat-box">
                <div class="message msg-luma">Sistema v14.1 (VIGIA) ativo. Diga "Ativar Vigia" para monitorizar o sistema.</div>
            </div>
            <div id="chat-input-area">
                <input type="text" id="chat-input" placeholder="Ex: Ativar Vigia..." autocomplete="off">
                <button id="send-btn">Enviar</button>
            </div>
        </div>
        <div id="preview-container">
            <h2 id="preview-text">Aguardando Código...</h2>
            <div id="ui-preview"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://luma-disruptor-cloud.onrender.com";

        async function fetchMetrics() {
            try {
                const response = await fetch(`${API_URL}/api/metrics`);
                const data = await response.json();
                document.getElementById('status').innerText = `Status: ${data.status}`;
                document.getElementById('metrics').innerHTML = `
                    <div class="card">
                        <h3>LatÃªncia do CÃ³rtex</h3>
                        <p>${data.cortex_latency_ms} ms</p>
                        <small>${data.latency_mode}</small>
                    </div>
                    <div class="card"><h3>TCO (3 Anos)</h3><p>US$ ${data.tco_3y_usd}</p></div>
                    <div class="card"><h3>Consumo DVS</h3><p>${data.dvs_power_watts} W</p></div>
                `;
            } catch (e) {
                document.getElementById('status').innerText = 'A acordar o servidor...';
            }
        }
        fetchMetrics();
        setInterval(fetchMetrics, 5000);

        let pollingInterval = null; let pollCount = 0;
        let loadingDiv = null;

        async function checkStatus() { pollCount++; if (pollCount > 20) { clearInterval(pollingInterval); if (loadingDiv) { loadingDiv.innerText = "[ERRO] O servidor demorou demasiado tempo (Timeout)."; loadingDiv.style.borderLeftColor = "#f88"; } return; }
            try {
                const response = await fetch(`${API_URL}/api/status`);
                const data = await response.json();
                const chatBox = document.getElementById('chat-box');

                if (data.status === 'done' || data.status === 'error') {
                    clearInterval(pollingInterval);
                    if (loadingDiv) chatBox.removeChild(loadingDiv);

                    if (data.tipo === 'conversa') {
                        const chatDiv = document.createElement('div');
                        chatDiv.className = 'message msg-luma';
                        chatDiv.innerText = `[LUMA] ${data.resultado}`;
                        chatBox.appendChild(chatDiv);
                    } else if (data.tipo === 'acao') {
                        const actDiv = document.createElement('div');
                        actDiv.className = 'message msg-luma';
                        if (data.sucesso) {
                            actDiv.innerText = `[LUMA] AÃ§Ã£o concluÃ­da. Sucesso: True`;
                            if (data.preview_html) {
                                document.getElementById('preview-text').style.display = 'none';
                                document.getElementById('ui-preview').innerHTML = <iframe srcdoc="" style="width:100%; height:100%; border:none;" sandbox="allow-scripts"></iframe>;
                            }
                        } else {
                            actDiv.style.borderLeftColor = '#f88';
                            actDiv.innerText = `[CISO BLOQUEOU] ${data.resultado}`;
                            document.getElementById('preview-text').style.display = 'block';
                            document.getElementById('preview-text').innerText = "Preview Bloqueado";
                            document.getElementById('preview-text').style.color = "#f88";
                            document.getElementById('ui-preview').innerHTML = "";
                        }
                        chatBox.appendChild(actDiv);
                    }
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            } catch(e) {}
        }

        async function sendCommand() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg) return;

            const chatBox = document.getElementById('chat-box');
            const userDiv = document.createElement('div');
            userDiv.className = 'message msg-user';
            userDiv.innerText = msg;
            chatBox.appendChild(userDiv);
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            loadingDiv = document.createElement('div');
            loadingDiv.className = 'message msg-luma';
            loadingDiv.innerText = `[LUMA] A processar...`;
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                await fetch(`${API_URL}/api/command`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command: msg })
                });
                if (pollingInterval) clearInterval(pollingInterval);
                pollingInterval = setInterval(checkStatus, 2000);
            } catch (e) {
                chatBox.removeChild(loadingDiv);
            }
        }

        document.getElementById('send-btn').addEventListener('click', sendCommand);
        document.getElementById('chat-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendCommand(); });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registado:', reg.scope))
                    .catch(err => console.log('Erro SW:', err));
            });
        }
    </script>
</body>
</html>
